<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <!-- Source of the README header. Rendered to header-light.png / header-dark.png
       (add class="dark" on the root) and social-preview.png by scripts/screenshots.mjs. -->
  <style>
    svg {
      --bg1: #FBFCFF; --bg2: #EAEFFF; --dot: #D5DCF4; --ink: #1B2150; --muted: #5A628C; --accent: #4F6BED;
      --card: #FFFFFF; --card-line: #DCE1F5; --bar: #F4F6FD; --node: #FFFFFF; --node-line: #7480B8;
      --group: #F3F6FF; --group-line: #C3CBF3; --edge: #8A93BF; --chip: #FFFFFF; --chip-line: #D6DCF5;
      --kw: #8A3FBF; --arrow: #C2410C; --cmt: #9AA0B8; --shadow: rgba(40, 52, 120, 0.14);
    }
    svg.dark {
      --bg1: #0D1322; --bg2: #18223D; --dot: #25314F; --ink: #E8EDF8; --muted: #A3AECD; --accent: #8FA3FF;
      --card: #141C30; --card-line: #2A3656; --bar: #18213A; --node: #1B2540; --node-line: #8794C4;
      --group: #172142; --group-line: #34446F; --edge: #7F8DB8; --chip: #161F37; --chip-line: #2E3B60;
      --kw: #C792EA; --arrow: #F5A25D; --cmt: #6E7896; --shadow: rgba(0, 0, 0, 0.45);
    }
    .ink { fill: var(--ink); } .muted { fill: var(--muted); } .accent { fill: var(--accent); }
    .card { fill: var(--card); stroke: var(--card-line); stroke-width: 1.2; }
    .bar { fill: var(--bar); }
    .node { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; }
    .sel { fill: var(--node); stroke: var(--accent); stroke-width: 2.4; }
    .group { fill: var(--group); stroke: var(--group-line); stroke-width: 1.3; }
    .edge { fill: none; stroke: var(--edge); stroke-width: 1.8; }
    .drag { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 5 4; }
    .handle { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
    .chip { fill: var(--chip); stroke: var(--chip-line); stroke-width: 1.2; }
    .lbl { font-size: 13px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
    .code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12.5px; fill: var(--ink); }
    .kw { fill: var(--kw); font-weight: 700; } .ar { fill: var(--arrow); } .cm { fill: var(--cmt); }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--bg1)"/>
      <stop offset="1" style="stop-color: var(--bg2)"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" style="fill: var(--dot)"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade-mask"><rect x="-1000" y="-1000" width="4000" height="4000" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" style="flood-color: var(--shadow)"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5 z" style="fill: var(--edge)"/>
    </marker>
    <clipPath id="canvas-clip"><rect x="830" y="66" width="390" height="218" rx="0"/></clipPath>
  </defs>

  <!-- oversized so the social card can widen the viewBox -->
  <rect x="-1000" y="-1000" width="4000" height="4000" fill="url(#bg)"/>
  <rect x="-1000" y="-1000" width="4000" height="4000" fill="url(#dots)" mask="url(#fade-mask)"/>

  <!-- logo + wordmark -->
  <g transform="translate(72 74) scale(1.75)">
    <rect x="2" y="4" width="12" height="9" rx="2" class="accent"/>
    <rect x="18" y="19" width="12" height="9" rx="2" class="accent"/>
    <path d="M8 13v7a3 3 0 0 0 3 3h7" fill="none" style="stroke: var(--accent)" stroke-width="2.4"/>
  </g>
  <text x="140" y="124" class="ink" font-size="62" font-weight="800" letter-spacing="-1.5">mermdraw</text>
  <text x="72" y="180" class="ink" font-size="23" font-weight="600">Drag-and-drop mermaid diagrams that live</text>
  <text x="72" y="210" class="muted" font-size="23" font-weight="500">in your markdown and your git history.</text>

  <g font-size="13" font-weight="600">
    <rect x="72" y="238" width="140" height="28" rx="14" class="chip"/>
    <text x="142" y="257" text-anchor="middle" class="accent">Rust · zero deps</text>
    <rect x="220" y="238" width="112" height="28" rx="14" class="chip"/>
    <text x="276" y="257" text-anchor="middle" class="accent">works offline</text>
    <rect x="340" y="238" width="146" height="28" rx="14" class="chip"/>
    <text x="413" y="257" text-anchor="middle" class="accent">renders on GitHub</text>
    <rect x="494" y="238" width="52" height="28" rx="14" class="chip"/>
    <text x="520" y="257" text-anchor="middle" class="accent">MIT</text>
  </g>

  <!-- code card -->
  <g filter="url(#shadow)">
    <rect x="606" y="84" width="244" height="182" rx="12" class="card"/>
  </g>
  <rect x="606.6" y="84.6" width="242.8" height="26" rx="11.4" class="bar"/>
  <circle cx="624" cy="97.5" r="4" fill="#F26B5E"/><circle cx="638" cy="97.5" r="4" fill="#F5BE4F"/><circle cx="652" cy="97.5" r="4" fill="#5FC454"/>
  <text x="670" y="102" class="muted" font-size="11.5" font-weight="600">architecture.md</text>
  <g class="code">
    <text x="622" y="134" class="cm">```mermaid</text>
    <text x="622" y="155"><tspan class="kw">flowchart</tspan> LR</text>
    <text x="640" y="176">web <tspan class="ar">--&gt;</tspan> api</text>
    <text x="640" y="197">api <tspan class="ar">--&gt;</tspan> db[(Postgres)]</text>
    <text x="640" y="218">api <tspan class="ar">-.-&gt;</tspan> queue</text>
    <text x="640" y="239" class="cm">%% mermdraw:layout …</text>
    <text x="622" y="258" class="cm">```</text>
  </g>

  <!-- canvas card -->
  <g filter="url(#shadow)">
    <rect x="830" y="40" width="390" height="244" rx="16" class="card"/>
  </g>
  <rect x="830.6" y="40.6" width="388.8" height="26" rx="15.4" class="bar"/>
  <rect x="830.6" y="56" width="388.8" height="10.6" class="bar"/>
  <text x="852" y="58" class="muted" font-size="11.5" font-weight="600">Canvas</text>
  <text x="1198" y="58" class="muted" font-size="11.5" font-weight="600" text-anchor="end">⇄ live sync</text>
  <rect x="830" y="66" width="390" height="218" fill="url(#dots)" clip-path="url(#canvas-clip)" opacity="0.8"/>

  <rect x="975" y="88" width="230" height="176" rx="10" class="group"/>
  <text x="989" y="107" class="muted" font-size="12" font-weight="700">Platform · GCP</text>

  <path d="M942 172 C974 172 974 148 1003 148" class="edge" marker-end="url(#arrow)"/>
  <path d="M1103 148 C1150 148 1150 162 1150 194" class="edge" marker-end="url(#arrow)"/>
  <path d="M1055 167 C1055 190 1040 188 1040 206" class="edge" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M900 190 C900 222 920 240 944 248" class="drag"/>

  <rect x="858" y="154" width="84" height="36" rx="18" class="node"/>
  <text x="900" y="177" class="lbl">Web</text>

  <rect x="1007" y="129" width="96" height="38" rx="6" class="sel"/>
  <text x="1055" y="153" class="lbl">API</text>
  <circle cx="1055" cy="129" r="4.5" class="handle"/><circle cx="1103" cy="148" r="4.5" class="handle"/>
  <circle cx="1055" cy="167" r="4.5" class="handle"/><circle cx="1007" cy="148" r="4.5" class="handle"/>

  <polygon points="1010,226 1018,209 1062,209 1070,226 1062,243 1018,243" class="node"/>
  <text x="1040" y="231" class="lbl">Queue</text>

  <path d="M1106 206 A44 8 0 0 1 1194 206 V238 A44 8 0 0 1 1106 238 Z" class="node"/>
  <path d="M1106 206 A44 8 0 0 0 1194 206" class="edge" style="stroke: var(--node-line); stroke-width: 1.5"/>
  <text x="1150" y="230" class="lbl">Postgres</text>

  <circle cx="900" cy="190" r="4.5" class="handle"/>
  <path d="M944 240 l0 19 l5 -5 l4 9 l3.5 -1.6 l-4 -8.6 l7 0 z" style="fill: var(--ink); stroke: var(--card); stroke-width: 1.4; stroke-linejoin: round"/>
</svg>
