[package]
name = "mmdr"
version = "0.1.0"
edition = "2021"
description = "A tiny local visual editor for mermaid diagrams that live inside markdown files"
license = "MIT"
readme = "README.md"
authors = ["berttoli"]
repository = "https://github.com/berttoli/mmdr"
homepage = "https://github.com/berttoli/mmdr"
keywords = ["mermaid", "diagram", "markdown", "architecture", "editor"]
categories = ["command-line-utilities", "visualization"]
# the binary embeds web/; tests and examples stay in the repo only
include = ["/src", "/web", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
# none on purpose: std-only HTTP server, file watcher and CLI

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
