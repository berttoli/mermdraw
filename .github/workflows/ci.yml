name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole suite on the tagged commit before building binaries
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Smoke test (CLI + HTTP API)
        if: runner.os != 'Windows'
        run: tests/smoke.sh target/release/mermdraw
      - name: Installer (install.sh)
        if: runner.os != 'Windows'
        run: tests/installer.sh target/release/mermdraw
      - name: Installer (install.ps1, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: tests/installer.ps1 target/release/mermdraw.exe
      - name: Installer (install.ps1, PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/installer.ps1 target/release/mermdraw.exe

  web:
    name: Web model · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Parser, serializer and example tests
        run: node --test tests/*.test.mjs
      - name: Syntax-check browser modules
        run: for f in web/*.js; do node --check "$f"; done

  package:
    name: Package · static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Lint release and test scripts
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Build, package and verify the release archive
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          scripts/release.sh package x86_64-unknown-linux-musl target/x86_64-unknown-linux-musl/release/mermdraw dist
          scripts/release.sh verify dist/mermdraw-x86_64-unknown-linux-musl.tar.gz
